<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotcheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">SPOTCHECK</span>
      <span class="sub">receipts · reports · cases</span>
    </div>
    <div class="stats mono" id="stats">—</div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h1>Case queue</h1>
        <div class="actions">
          <button type="button" id="btn-rescan">Rescan rules</button>
          <button type="button" id="btn-refresh" class="ghost">Refresh</button>
        </div>
      </div>
      <div id="cases" class="list"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Receipts</h2>
      </div>
      <div id="receipts" class="list receipts"></div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
